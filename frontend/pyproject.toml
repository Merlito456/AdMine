[project]
name = "admine"
version = "1.0.0"
description = "AdMine Blockchain Frontend"
requires-python = ">=3.9,<3.12"
dependencies = [
    "streamlit>=1.28.0,<1.30.0",
    "requests>=2.31.0,<3.0.0",
    "pandas>=1.5.0,<2.0.0",
    "numpy>=1.23.0,<1.24.0",
    "plotly>=5.14.0,<6.0.0",
    "python-dotenv>=1.0.0,<2.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
